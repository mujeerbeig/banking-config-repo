server.port=8084

# =========================
# Gateway Routes
# =========================

# customer service
spring.cloud.gateway.routes[1].id=customer-service
spring.cloud.gateway.routes[1].uri=lb://customer-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/customers/**

#Account service
spring.cloud.gateway.routes[0].id=account-service
spring.cloud.gateway.routes[0].uri=lb://account-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/account/**

# kyc service
spring.cloud.gateway.routes[1].id=kyc-service
spring.cloud.gateway.routes[1].uri=lb://kyc-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/kyc/**

eureka.client.service-url.defaultZone=http://localhost:8761/eureka